# git-cliff configuration for changelog generation
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**BREAKING**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
    # Conventional Commits format (if used)
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore|^ci", group = "Miscellaneous Tasks" },
    { body = ".*security", group = "Security" },
    # Natural language patterns (jj-friendly)
    { message = "^[Aa]dd", group = "Features" },
    { message = "^[Ii]mplement", group = "Features" },
    { message = "^[Ss]upport", group = "Features" },
    { message = "^[Ff]ix", group = "Bug Fixes" },
    { message = "^[Rr]esolve", group = "Bug Fixes" },
    { message = "^[Uu]pdate.*[Dd]oc", group = "Documentation" },
    { message = "^[Uu]pdate.*README", group = "Documentation" },
    { message = "^[Rr]efactor", group = "Refactoring" },
    { message = "^[Tt]est", group = "Testing" },
    { message = "^[Mm]erge", skip = true },
    { message = "^[Aa]rchive", skip = true },
]
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "newest"
