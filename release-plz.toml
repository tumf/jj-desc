# release-plz configuration
# https://release-plz.dev/docs/config

[workspace]
# Allow updating dependencies in Cargo.lock
allow_dirty = false
# Generate changelog using git-cliff
changelog_update = true
# Create git tag for release
git_tag_enable = true
# Create GitHub release
git_release_enable = true
# Use conventional commits for changelog
changelog_config = "cliff.toml"
# PR title format
pr_name = "chore: release v{{ version }}"
# Commit message format
commit_msg = "chore: release v{{ version }}"

# Package-specific configuration
[[package]]
name = "jj-desc"
# Don't publish to crates.io (GitHub releases only)
publish = false
