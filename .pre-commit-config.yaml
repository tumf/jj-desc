# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Conventional Commits validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  - repo: local
    hooks:
      # CI format check - runs on every commit
      - id: cargo-fmt-check
        name: cargo fmt --check (CI format validation)
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      # CI clippy check - runs on every commit
      - id: cargo-clippy
        name: cargo clippy -- -D warnings (CI lint)
        entry: cargo clippy --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # CI test check - runs on pre-push only to save time
      - id: cargo-test
        name: cargo test --all-features (CI test)
        entry: cargo test --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
