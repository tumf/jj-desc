[package]
name = "jj-desc"
version = "0.4.3"
edition = "2024"
rust-version = "1.85"
description = "Generate jj commit descriptions using LLM"
license = "MIT"
repository = "https://github.com/tumf/jj-desc"
homepage = "https://github.com/tumf/jj-desc"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
async-trait = "0.1"

# HTTP client (rustls for no OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rstest = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-release configuration
[package.metadata.release]
# Don't publish to crates.io
publish = false
# Create git tag
tag = true
# Tag name format
tag-name = "v{{version}}"
# Push to remote
push = false
# Sign commits and tags
sign-commit = false
sign-tag = false
# Pre-release hook to update CHANGELOG
pre-release-hook = ["git", "cliff", "-o", "CHANGELOG.md", "--tag", "v{{version}}"]
